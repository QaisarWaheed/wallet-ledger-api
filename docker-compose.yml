name: wallet-ledger

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    # Tuned for a laptop running a 10M-row ledger. Durability settings
    # (fsync, synchronous_commit, full_page_writes) are deliberately left ON.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
    shm_size: 1g
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db:/db:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on localhost only, on an uncommon port, for tests and SQL checks.
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      # TCP check: the init-time server listens on the socket only, so this
      # passes only once the schema is loaded and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      # 4 worker processes x 16 connections = 64, well under max_connections=200.
      WEB_CONCURRENCY: "4"
      DB_POOL_SIZE: "16"
      LOG_LEVEL: warn
      # Swagger UI at http://localhost:8080/docs. Off by default because the
      # brief requires the token on every endpoint: ENABLE_DOCS=true docker compose up
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-off job: docker compose --profile seed run --rm seed
  seed:
    image: postgres:17-alpine
    profiles: ["seed"]
    environment:
      PGHOST: db
      PGUSER: ledger
      PGPASSWORD: ledger
      PGDATABASE: ledger
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v scale=${SEED_SCALE:-1} -f /db/seed.sql"]

  # Load test from inside the Docker network (no host port-forwarding in the path):
  #   docker compose --profile loadtest run --rm loadtest --scenario mixed
  loadtest:
    image: node:24-alpine
    profiles: ["loadtest"]
    working_dir: /app
    environment:
      API_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
    volumes:
      - ./loadtest:/app/loadtest
    depends_on:
      - api
    entrypoint: ["node", "loadtest/run.ts"]

volumes:
  pgdata:
